[project]
name = "triald"
description = "Scriptable trial control daemon for brain research"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Joscha Schmiedt" }]
requires-python = ">=3.12"

# NOT the version of anything shipped - a deliberately invalid sentinel, as in
# vstimd. The real version comes from the git tag (packaging/scripts/git-version.sh)
# and is stamped into the package at build time. A 0.0.0 artifact means the
# stamping was bypassed.
version = "0.0.0"

dependencies = []

[project.optional-dependencies]
# The daemon proper. Kept out of the core so the domain logic, the simulator and
# the policy API can be imported and tested with nothing installed at all.
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    # The client for whatever runs a trial (api/statemachine_executor.py). Here
    # rather than in the core so that triald.executor -- the contract and the
    # translation of what an executor publishes -- imports nothing at all and is
    # testable with dictionaries.
    "httpx>=0.28",
    # statemachined's own client, from statemachined's own repository. triald
    # used to carry a hand-written copy of that daemon's paths, refusal shape and
    # stream rules; a second description of somebody else's API is right until
    # the day it is not, and the day it is not is a session. Same move as
    # `vstimd-client` below, same reason.
    #
    # **The base tier only, which is the whole point of it being tiered.** This
    # pulls `statemachined.model` and `statemachined.client` -- pydantic, httpx,
    # websockets -- and nothing else. Not pyserial: triald never opens a serial
    # port, and `statemachined.device` is what would need one. Not fastapi or
    # uvicorn: `statemachined[serve]` is the daemon, and triald talks to a
    # daemon rather than being one. Depending on the distribution named
    # `statemachined` is not depending on the daemon.
    #
    # LGPL, so importing it places nothing here under copyleft.
    "statemachined",
]

# Adaptive procedures beyond the up/down family in triald.adaptive. Never a hard
# dependency: PsychoPy drags a GUI stack onto a headless rig box. On a rig these
# are installed into the daemon's own vendored interpreter with
# `trialctl env install` rather than declared here. See dev/PLAN.md.
adaptive = ["questplus>=2023.1"]

[project.scripts]
triald = "triald.cli:main"

[dependency-groups]
# Subscribing to a stimulus display's event stream
# (api/stimulus_subscriber.py), and the three-daemon end-to-end test.
#
# **Optional, and that is load-bearing.** A rig with no display daemon runs
# triald unchanged: `triald.stimulus` -- the join itself -- imports nothing and
# is testable with integers, and `stimulus_subscriber` imports the client inside
# a function so triald starts without it. Nothing in the session loop learns
# whether a display exists.
#
# A group rather than an optional-dependency because vstimd is not on a package
# registry, so a resolver asked to satisfy `triald[stimulus]` cannot. The same
# reason and the same shape as statemachined's `e2e` group.
stimulus = ["vstimd-client"]

dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "ty>=0.0.1a1",
    # The API tests drive the app through FastAPI's TestClient, which is httpx.
    # The `serve` extra has to be installed for them to run at all; without it
    # tests/test_api.py skips itself.
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triald"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 96
src = ["src", "tests"]
# Vendored byte-for-byte from braemons/contracts, and the point of it is that
# the copy is identical. A formatter with a different opinion here would rewrite
# the file and the sync check in that repo would then call it stale for ever.
extend-exclude = ["tests/contracts"]

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle, pyflakes
    "I",               # import sorting
    "UP",              # pyupgrade
    "B",               # bugbear
    "SIM",             # simplify
    "RUF",
]
ignore = [
    "B008",   # function call in default argument - fine for our dataclass factories
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ty.src]
include = ["src"]

[tool.uv.sources]
# statemachined's Python package, from its repo, for the same reason vstimd's
# client is below: it is not on a package registry. `main` rather than a tag
# while both sides are pre-release -- the client and the API it describes ship
# from one commit, so a pin here would be a pin to a client older than the
# daemon it is talking to.
statemachined = { git = "https://github.com/braemons/statemachined.git", subdirectory = "python", branch = "main" }

# vstimd's Python client, from its repo: it is not published to a registry. The
# pin is the 0.2 branch, which is where the event stream lives — 0.1 is released
# and has no PUB socket at all.
vstimd-client = { git = "https://github.com/braemons/vstimd.git", subdirectory = "client/python", branch = "0.2" }
