[project]
name = "triald"
description = "Scriptable trial control daemon for brain research"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Joscha Schmiedt" }]
requires-python = ">=3.12"

# NOT the version of anything shipped - a deliberately invalid sentinel, as in
# vstimd. The real version comes from the git tag (packaging/scripts/git-version.sh)
# and is stamped into the package at build time. A 0.0.0 artifact means the
# stamping was bypassed.
version = "0.0.0"

dependencies = []

[project.optional-dependencies]
# The daemon proper. Kept out of the core so the domain logic, the simulator and
# the policy API can be imported and tested with nothing installed at all.
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    # The client for whatever runs a trial (api/statemachine_executor.py). Here
    # rather than in the core so that triald.executor -- the contract and the
    # translation of what an executor publishes -- imports nothing at all and is
    # testable with dictionaries.
    "httpx>=0.28",
]

# Adaptive procedures beyond the up/down family in triald.adaptive. Never a hard
# dependency: PsychoPy drags a GUI stack onto a headless rig box. On a rig these
# are installed into the daemon's own vendored interpreter with
# `trialctl env install` rather than declared here. See dev/PLAN.md.
adaptive = ["questplus>=2023.1"]

[project.scripts]
triald = "triald.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "ty>=0.0.1a1",
    # The API tests drive the app through FastAPI's TestClient, which is httpx.
    # The `serve` extra has to be installed for them to run at all; without it
    # tests/test_api.py skips itself.
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triald"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 96
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle, pyflakes
    "I",               # import sorting
    "UP",              # pyupgrade
    "B",               # bugbear
    "SIM",             # simplify
    "RUF",
]
ignore = [
    "B008",   # function call in default argument - fine for our dataclass factories
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ty.src]
include = ["src"]
