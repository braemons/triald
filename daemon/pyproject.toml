[project]
name = "triald"
description = "Scriptable trial control daemon for brain research"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Joscha Schmiedt" }]
requires-python = ">=3.12"

# NOT the version of anything shipped - a deliberately invalid sentinel, as in
# vstimd. The real version comes from the git tag (packaging/scripts/git-version.sh)
# and is stamped into the package at build time. A 0.0.0 artifact means the
# stamping was bypassed.
version = "0.0.0"

dependencies = []

[project.optional-dependencies]
# The daemon proper. Kept out of the core so the domain logic, the simulator and
# the policy API can be imported and tested with nothing installed at all.
serve = [
    # The API is gRPC. `grpc.aio` serves it on the daemon's own port, and
    # uvicorn serves `api/web_edge.py` — the panels, and the Connect protocol
    # a browser can speak — beside it.
    #
    # **fastapi and pydantic were here and are not.** The interface is
    # authored in `proto/triald/v1/` and the types are generated from it, so a
    # web framework's schema generation had nothing left to describe but
    # itself, and the routes it declared were a second spelling of the rpcs.
    "grpcio>=1.66",
    "uvicorn[standard]>=0.32",
    # The client for whatever runs a trial (api/statemachine_executor.py). Here
    # rather than in the core so that triald.executor -- the contract and the
    # translation of what an executor publishes -- imports nothing at all and is
    # testable with dictionaries.
    "httpx>=0.28",
    # The generated wire types and their JSON mapping. Runtime only: protoc
    # runs from `make proto` and the output is committed, so a checkout needs
    # no compiler (`contracts/DAEMON_LAYOUT.md`).
    #
    # In `serve` rather than the core deliberately, like grpcio beside it: the
    # domain logic, the simulator and the policy API import nothing, and a
    # policy author should not be made to install a protobuf runtime to write
    # one.
    "protobuf>=5.27",
    # statemachined's own client, from statemachined's own repository. triald
    # used to carry a hand-written copy of that daemon's paths, refusal shape and
    # stream rules; a second description of somebody else's API is right until
    # the day it is not, and the day it is not is a session. Same move as
    # `vstimd-client` below, same reason.
    #
    # **A distribution of its own, not a tier of the daemon's.** It was
    # `statemachined` -- the daemon's own package, whose base tier happened to
    # contain a client -- and taking it meant taking pydantic and that daemon's
    # document models. `statemachined-client` is generated from
    # `proto/statemachined/v1/` and its whole dependency list is grpcio and
    # protobuf, both of which are already here for triald's own API. Not
    # pyserial: triald never opens a serial port. Not fastapi or uvicorn:
    # triald talks to a daemon rather than being one.
    #
    # LGPL, so importing it places nothing here under copyleft.
    "statemachined-client",
]

# Adaptive procedures beyond the up/down family in triald.adaptive. Never a hard
# dependency: PsychoPy drags a GUI stack onto a headless rig box. On a rig these
# are installed into the daemon's own vendored interpreter with
# `trialctl env install` rather than declared here. See dev/PLAN.md.
adaptive = ["questplus>=2023.1"]

[project.scripts]
triald = "triald.cli:main"

[dependency-groups]
# Subscribing to a stimulus display's event stream
# (api/stimulus_subscriber.py), and the three-daemon end-to-end test.
#
# **Optional, and that is load-bearing.** A rig with no display daemon runs
# triald unchanged: `triald.stimulus` -- the join itself -- imports nothing and
# is testable with integers, and `stimulus_subscriber` imports the client inside
# a function so triald starts without it. Nothing in the session loop learns
# whether a display exists.
#
# A group rather than an optional-dependency because vstimd is not on a package
# registry, so a resolver asked to satisfy `triald[stimulus]` cannot. The same
# reason and the same shape as statemachined's `e2e` group.
stimulus = ["vstimd-client"]

dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "ty>=0.0.1a1",
    # protoc and the gRPC stub generator. Development only: the generated code
    # is committed, so an install needs neither (`contracts/DAEMON_LAYOUT.md`).
    "grpcio-tools>=1.66",
    # The three-daemon end-to-end test talks to statemachined and vstimd over
    # the network. The browser edge's own tests need no client at all: they
    # drive the ASGI app directly (tests/test_the_browser_edge.py).
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triald"]

# **The panels are not listed here, and that is deliberate.**
#
# They are authored in `client/web/`, a sibling of `daemon/` rather than a
# subdirectory of it, so that somebody looking for this daemon's UI finds it
# without knowing how the Python package is laid out
# (`contracts/DAEMON_LAYOUT.md`). hatchling can force-include a path from
# outside the project, and it is a trap: `uv build` builds the wheel *from the
# sdist*, an sdist cannot contain a path above its own root, and the wheel then
# fails on a machine that never saw the repository.
#
# So `packaging/Makefile` copies `client/web` into the staged package before
# building, and `find_web_root` in `api/web_edge.py` falls back to the authored
# location when no copy has been made — which is every editable install, and
# therefore every developer. Build with `make wheel`, not `uv build`.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 96
src = ["src", "tests"]
# Generated by protoc and committed. A formatter with an opinion about it would
# rewrite the file and `make check-proto` would then call it stale for ever.
extend-exclude = ["src/triald/_proto"]

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle, pyflakes
    "I",               # import sorting
    "UP",              # pyupgrade
    "B",               # bugbear
    "SIM",             # simplify
    "RUF",
]
ignore = [
    "B008",   # function call in default argument - fine for our dataclass factories
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ty.src]
include = ["src"]
exclude = ["src/triald/_proto"]

# **ty cannot see `triald.v1`, and that is expected.** The generated modules
# reach each other by that name because `triald/__init__.py` extends `__path__`
# at import time, which is a runtime fact a static checker has no way to follow
# — vstimd's client has the same arrangement and the same blind spot. The
# imports are exercised by the test suite instead, which is the check that
# actually runs the code.

[tool.uv.sources]
# statemachined's Python client, from its repo, for the same reason vstimd's
# client is below: it is not on a package registry. `main` rather than a tag
# while both sides are pre-release -- the client and the proto it is generated
# from ship from one commit, so a pin here would be a pin to a client older
# than the daemon it is talking to.
#
# `client/python`, which is where every daemon in this family keeps its client
# (contracts/DAEMON_LAYOUT.md). The old pin said `python`, which is the
# directory that daemon's own package lived in before it became `daemon/` --
# so it had stopped resolving some time before this.
statemachined-client = { git = "https://github.com/braemons/statemachined.git", subdirectory = "client/python", branch = "main" }

# vstimd's Python client, from its repo: it is not published to a registry. The
# pin is the 0.2 branch, which is where the event stream lives — 0.1 is released
# and has no PUB socket at all.
vstimd-client = { git = "https://github.com/braemons/vstimd.git", subdirectory = "client/python", branch = "0.2" }
