<!doctype html>
<!--
  triald's session view.

  A proof of principle, and deliberately a small one: no build step, no
  framework, no CDN. A rig box may have no route to the internet and a browser
  in a booth should not be waiting on unpkg, so everything this page needs is in
  these three files, served by the daemon itself.

  It talks to exactly the API in dev/API.md - the same calls the Python, MATLAB
  and Bonsai clients make. Nothing here reaches into the daemon by a private
  route, which is the point of writing the UI against the schema.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>triald</title>
    <link rel="stylesheet" href="/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232f6f4f'/%3E%3Cpath d='M4 11.5V4.5M8 11.5V7M12 11.5V6' stroke='white' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="bar">
      <h1>triald</h1>
      <div class="pills" id="status-pills"></div>
      <div class="grow"></div>
      <div class="link-state" id="link-state">connecting…</div>
    </header>

    <div id="banner" class="banner" hidden></div>

    <main>
      <!-- Left: what is running, and the controls that change it. -->
      <section class="col col-controls">
        <article class="card">
          <h2>Session</h2>
          <div class="current" id="current-trial"></div>
          <div class="btn-row">
            <button id="btn-arm" class="primary">Arm</button>
            <button id="btn-stop">Stop</button>
          </div>
          <div class="btn-row">
            <button id="btn-rec-start">Start rec</button>
            <button id="btn-rec-pause">Pause</button>
            <button id="btn-rec-resume">Resume</button>
            <button id="btn-rec-stop">Stop rec</button>
          </div>
          <div class="btn-row">
            <button id="btn-reset-rounds">Reset rounds</button>
            <button id="btn-reset-counters">Reset counts</button>
          </div>
          <dl class="facts" id="session-facts"></dl>
        </article>

        <article class="card">
          <h2>
            Debug
            <span class="tag" title="These buttons drive a simulated subject through the real trial loop.">simulated subject</span>
          </h2>
          <div class="btn-row">
            <button data-step="1">Step 1</button>
            <button data-step="10">Step 10</button>
            <button data-step="100">Step 100</button>
            <button data-step="500">Step 500</button>
          </div>
          <div class="btn-row">
            <button id="btn-free-run" class="primary">Free run</button>
            <label class="inline">
              every
              <input id="free-run-interval" type="number" min="10" max="60000" step="10" value="250" />
              ms
            </label>
          </div>

          <h3>
            One trial by hand
            <span class="hint">select, then report an outcome</span>
          </h3>
          <div class="btn-row">
            <button id="btn-next-trial">Next trial</button>
            <button id="btn-cancel-trial">Cancel</button>
          </div>
          <div class="outcome-grid" id="outcome-buttons"></div>
          <div class="btn-row modifiers">
            <label class="inline"><input type="checkbox" id="mod-frame-loss" /> frame loss</label>
            <label class="inline"><input type="checkbox" id="mod-imprecise" /> imprecise fixation</label>
          </div>

          <h3>The subject</h3>
          <div class="sliders" id="sim-sliders"></div>
        </article>
      </section>

      <!-- Middle: the counters, which is what an experimenter actually watches. -->
      <section class="col col-counters">
        <article class="card grow-card">
          <h2>
            Counters
            <span class="hint" id="counters-note"></span>
          </h2>
          <div class="table-scroll">
            <table class="counters" id="counters"></table>
          </div>
        </article>

        <article class="card">
          <h2>Recent trials</h2>
          <div class="table-scroll short">
            <table class="trials" id="trial-log"></table>
          </div>
        </article>
      </section>

      <!-- Right: the declarative config, and the sets it runs over. -->
      <section class="col col-config">
        <article class="card">
          <h2>Trial type sequence</h2>
          <label class="field">
            <span>Ordering</span>
            <select id="cfg-ordering"></select>
          </label>
          <p class="hint" id="ordering-help"></p>
          <label class="field">
            <span>Rounds</span>
            <input id="cfg-rounds" type="number" min="1" max="100000" />
          </label>
          <label class="inline"><input type="checkbox" id="cfg-avoid-repeat" /> Avoid repetitions</label>
          <label class="inline"
            ><input type="checkbox" id="cfg-extend" /> Extend trial type no. by set no.</label
          >

          <h3>Stopping</h3>
          <label class="inline"
            ><input type="checkbox" id="cfg-stop-rounds" /> Stop if all rounds done</label
          >
          <div class="field-row">
            <label class="inline"><input type="checkbox" id="cfg-stop-after-on" /> Stop after</label>
            <input id="cfg-stop-after" type="number" min="1" max="1000000" />
            <select id="cfg-stop-criterion"></select>
          </div>

          <h3>Accept trials done with</h3>
          <div class="accept-grid" id="acceptance"></div>
        </article>

        <article class="card">
          <h2>
            Trial type sets
            <span class="hint">a chain of rules is the sequence</span>
          </h2>
          <div id="chain-problem" class="problem" hidden></div>
          <div id="sets"></div>
        </article>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
