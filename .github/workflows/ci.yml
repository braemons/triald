name: Build and Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      # The Python project is `daemon/`, beside `client/` and `proto/`
      # (contracts/DAEMON_LAYOUT.md), so every uv command names it.
      #
      # **`--extra serve`, because the suite tests the serve tier.** The
      # servicers, the browser edge and the executor's seam to statemachined are
      # all behind it, and until now they were reached by accident: `grpcio`
      # arrived as a dependency of `grpcio-tools` in the dev group, and
      # `statemachined-client` did not arrive at all — so the executor's tests
      # failed to import the moment they were written. A suite that covers a
      # tier should install it rather than hope its dependencies leak in.
      - run: uv sync --directory daemon --group dev --extra serve --python ${{ matrix.python }}
      - name: Lint
        run: |
          uv run --directory daemon ruff check .
          uv run --directory daemon ruff format --check .
      - name: Type check
        run: uv run --directory daemon ty check
        continue-on-error: true
      - name: Test
        run: uv run --directory daemon pytest --cov=triald --cov-report=term-missing
      - name: Simulated session
        # The end-to-end smoke test: a whole session, no hardware.
        run: |
          uv run --directory daemon triald sim --trials 200
          uv run --directory daemon triald policy check ../examples/staircase.py --trial-types contrast_0,contrast_1,contrast_2,contrast_3,contrast_4,contrast_5
