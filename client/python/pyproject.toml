[project]
name = "triald-client"
description = "Python client for triald — the trial control daemon's API, as types"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Joscha Schmiedt" }]
requires-python = ">=3.12"

# NOT the version of anything shipped — a deliberately invalid sentinel, as in
# vstimd, mousewheeld and the daemon beside this. The real version comes from
# the git tag and is stamped in at build time; a 0.0.0 artifact means the
# stamping was bypassed.
version = "0.0.0"

# Two, and both are runtime. `grpcio` is the transport and `protobuf` is the
# generated types it carries; the stubs are committed, so `grpcio-tools` and
# protoc are a development dependency and not an installation one
# (`contracts/DAEMON_LAYOUT.md`).
dependencies = [
    "grpcio>=1.66",
    "protobuf>=5.27",
]

# `trialctl`, not `triald`: the daemon owns that name, and on a rig box both are
# installed. dev/PLAN.md has been calling the client's CLI `trialctl` since
# before there was one.
[project.scripts]
trialctl = "triald_client.command_line_interface:main"

[dependency-groups]
dev = [
    "grpcio-tools>=1.66",
    "pytest>=8.3",
    "ruff>=0.8",
    "ty>=0.0.1a1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["triald_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.src]
# The generated stubs are not hand-written and not reviewed as source; they are
# checked by being used, and everything that touches them is
# `_wire_conversions.py`.
exclude = ["triald_client/_proto"]

[tool.ruff]
line-length = 96
src = ["triald_client", "tests"]
# Generated by protoc and committed. A formatter with an opinion about it would
# rewrite the file and `make check-proto` would then call it stale for ever.
extend-exclude = ["triald_client/_proto"]

[tool.ruff.lint]
# The daemon's set, so one repository has one idea of what Python looks like.
select = [
    "E", "F", "W",     # pycodestyle, pyflakes
    "I",               # import sorting
    "UP",              # pyupgrade
    "B",               # bugbear
    "SIM",             # simplify
    "RUF",
]
ignore = [
    "B008",   # function call in default argument - fine for our dataclass factories
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
