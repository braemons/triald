syntax = "proto3";

package triald.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "triald/v1/common.proto";
import "braemons/v1/trial_outcome.proto";

// Where the first lost frame of a trial was seen.
message FrameLoss {
  int32 interval = 1;
  int32 frame = 2;
}

// One trial's result — **the daemon's primary inbound message**.
//
// Every modifier that participates in the accept decision has to be here,
// because the daemon has no other way to learn it: `frame_loss` comes from
// vstimd and `precise_fixation` from the eye monitor. This is interaction B of
// `contracts/INTERACTIONS.md`, and the three defects recorded there all lived
// in the gap between this shape and somebody's transcription of it.
message OutcomeReport {
  // Which trial this is the outcome of. Refused `failed_precondition` if it is
  // not the trial in flight.
  //
  // **Not part of the outcome: it addresses the message.** The report comes
  // from another machine over a network, and one that arrives late or twice
  // must be refused rather than attributed to the trial after the one it
  // belongs to. `contracts/INTERACTIONS.md` §5.1 is what leaving it out cost.
  //
  // `optional` although it is required, because proto3 has no required fields
  // and a plain `int64` cannot tell "trial 0" from "no trial named". Absent is
  // refused as a bad request — not as a conflict, which is what silently
  // reading it as zero produced.
  optional int64 trial_id = 1 [json_name = "trial_id"];

  braemons.v1.TrialOutcome outcome = 2;
  Manipulandum manipulandum = 3;

  optional double reaction_time_ms = 4 [json_name = "reaction_time_ms"];
  optional int32 terminating_interval = 5 [json_name = "terminating_interval"];

  // Whether fixation held within tolerance. Defaults to true when omitted,
  // which is the one place in this message where an absent field is not the
  // same as `false` — see the convert seam.
  optional bool precise_fixation = 6 [json_name = "precise_fixation"];

  optional FrameLoss frame_loss = 7 [json_name = "frame_loss"];
  int32 reward_ms = 8 [json_name = "reward_ms"];
  bool hit_condition = 9 [json_name = "hit_condition"];
  bool simulated = 10;
  optional string note = 11;
}

// The outcome block of a trial record.
//
// Carries the code *and* the name: the code is the `.tdr` wire contract that
// analysis decodes, the name is what a person reads in a log. Both, because the
// record on disk has carried both for years and this is the same object.
message Outcome {
  int32 code = 1;
  string name = 2;
  string manipulandum = 3;
  optional double reaction_time_ms = 4 [json_name = "reaction_time_ms"];
  optional int32 terminating_interval = 5 [json_name = "terminating_interval"];
  bool precise_fixation = 6 [json_name = "precise_fixation"];
  optional FrameLoss frame_loss = 7 [json_name = "frame_loss"];
  int32 reward_ms = 8 [json_name = "reward_ms"];
  bool hit_condition = 9 [json_name = "hit_condition"];
  bool simulated = 10;
  optional string note = 11;
}

// The selection for one trial, published the moment it is made.
//
// Everything here is latched at selection and stable for the whole trial —
// including `recording`, so a trial that began recording finishes recording
// even if somebody pauses in the middle of it.
message TrialSpec {
  int64 trial_number = 1 [json_name = "trial_number"];
  int32 trial_type_index = 2 [json_name = "trial_type_index"];
  int32 trial_type_number = 3 [json_name = "trial_type_number"];
  string trial_type_name = 4 [json_name = "trial_type_name"];
  string set_name = 5 [json_name = "set_name"];
  string statemachine_graph = 6 [json_name = "statemachine_graph"];
  int32 reward_ms = 7 [json_name = "reward_ms"];
  bool recording = 8;
  bool paused = 9;

  // RFC 3339, which is what `google.protobuf.Timestamp` puts on the wire:
  // `2026-09-18T12:00:00Z`. A typed instant rather than a string, so a client
  // gets a datetime from its generator rather than something to parse.
  google.protobuf.Timestamp started_at = 10 [json_name = "started_at"];
  optional google.protobuf.Timestamp deadline = 11;

  // The zone set mousewheeld arms for this trial; empty means none.
  string mousewheel_zone_set = 12 [json_name = "mousewheel_zone_set"];
}

// One finished trial.
//
// `accepted` and `refusal_reason` are the two fields worth reading first: a
// counted trial is not an accepted one, and the reason says which of the three
// acceptance checks turned it away.
message TrialRecord {
  TrialSpec trial = 1;
  Outcome outcome = 2;
  bool accepted = 3;
  optional string refusal_reason = 4 [json_name = "refusal_reason"];
  google.protobuf.Timestamp ended_at = 5 [json_name = "ended_at"];

  // Whatever the policy's `snapshot()` returned at the end of this trial.
  // Arbitrary, because a policy is somebody's Python and the daemon never
  // reads it.
  optional google.protobuf.Struct policy_state = 6 [json_name = "policy_state"];
}

// Why the trial in flight is being abandoned.
message CancelTrial {
  string reason = 1;
}
