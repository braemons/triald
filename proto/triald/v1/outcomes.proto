// How a trial ended.
enum TrialOutcome {
  // A start signal was required and never delivered.
  NOT_STARTED = 0;

  // Nothing decided yet - the trial is still in flight.
  UNDETERMINED = -1;

  // The correct response, in the window.
  HIT = 1;

  // A response, in the window, and the wrong one.
